<!-- Instructions for Google Search Console HTML verification:
  
  1. Go to https://search.google.com/search-console/
  2. Click "Add Property" → enter https://www.rangao.bd
  3. Choose "HTML file" verification method
  4. Download the verification file (e.g., google1234abcd5678efgh.html)
  5. Replace THIS file with the downloaded file in the public/ folder
  6. Deploy to Vercel — Vercel serves public/* files as static assets
  7. Click "Verify" in Search Console

  The verification URL will be:
  https://www.rangao.bd/google[code].html
  
  Example filename: google1234abcd5678efgh.html
  Example content:  google-site-verification: google1234abcd5678efgh.html

  ALTERNATIVELY — use the meta tag method (already supported):
  In Admin → Settings → SEO, paste your verification code into the
  "Google Search Console ID" field. The SEO component will inject
  <meta name="google-site-verification" content="..."> on every page.
  No file needed with this method.
-->
google-site-verification: REPLACE_WITH_YOUR_CODE.html
