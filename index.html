<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Language: Bengali Bangladesh only (no bn-IN targeting) -->
    <meta http-equiv="content-language" content="bn-BD" />
    <title>Rangao — প্রিমিয়াম ইসলামিক ও হোম ডেকোর</title>
    <meta name="description" content="Rangao (রাঙাও) — বাংলাদেশের সেরা প্রিমিয়াম ইসলামিক ওয়াল আর্ট, কাঠের ডেকোর, ক্যানভাস ও লাইফস্টাইল ডেকোর শপ।">
    <meta name="author" content="Rangao" />
    <!-- Global Organization Schema (stable, always-present) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.rangao.bd/#organization",
      "name": "Rangao",
      "alternateName": "রাঙাও",
      "url": "https://www.rangao.bd",
      "logo": "https://www.rangao.bd/brand/rangao-og-default.jpg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "Bengali"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BD"
      }
    }
    </script>


    <!-- Supabase CDN preconnect for hero image and assets -->
    <link rel="preconnect" href="https://yglexjxvypwmvjvsspil.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://yglexjxvypwmvjvsspil.supabase.co" />
    <!-- Vercel edge caching: HTML is a shell, assets are hashed — safe to cache -->
    <script>
      (function() {
        var cachedFavicon = localStorage.getItem("cached_favicon_url");
        if (cachedFavicon && (cachedFavicon.includes("lovable") || cachedFavicon.includes("gptengineer") || cachedFavicon.includes("lovable-uploader"))) {
          localStorage.removeItem("cached_favicon_url");
          cachedFavicon = null;
        }
        if (cachedFavicon && cachedFavicon.trim() !== "") {
          var cacheBustedUrl = cachedFavicon + (cachedFavicon.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
          var link = document.createElement("link");
          link.id = "dynamic-favicon";
          link.rel = "icon";
          link.href = cacheBustedUrl;
          
          var appleLink = document.createElement("link");
          appleLink.id = "dynamic-apple-icon";
          appleLink.rel = "apple-touch-icon";
          appleLink.href = cacheBustedUrl;
          
          document.head.appendChild(link);
          document.head.appendChild(appleLink);
        } else {
          var link = document.createElement("link");
          link.id = "dynamic-favicon";
          link.rel = "icon";
          link.href = "/favicon.ico?v=" + Date.now();
          
          var appleLink = document.createElement("link");
          appleLink.id = "dynamic-apple-icon";
          appleLink.rel = "apple-touch-icon";
          appleLink.href = "/favicon.ico?v=" + Date.now();
          
          document.head.appendChild(link);
          document.head.appendChild(appleLink);
        }
      })();
    </script>

    <!-- Google Fonts: Noto Sans Bengali + Plus Jakarta Sans (Non-blocking Asynchronous Load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://yglexjxvypwmvjvsspil.supabase.co" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />

    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
    </noscript>
  </head>

  </body>
</html>
