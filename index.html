    <!-- Inline Chunk/Script Load Failure Recovery Script -->
    <script>
      (function() {
        window.addEventListener("error", function(e) {
          try {
            var target = e.target;
            var isScript = target && target.tagName === "SCRIPT";
            var src = isScript && target.src ? String(target.src) : "";
            var isChunkError = (e.message && (e.message.indexOf("Failed to fetch dynamically imported module") >= 0 || e.message.indexOf("Importing a module script failed") >= 0)) ||
                               (isScript && src && (src.indexOf("/assets/") >= 0 || src.indexOf("/src/") >= 0 || src.indexOf("index") >= 0));
            if (isChunkError) {
              try {
                // Instantly unregister all active Service Workers to break caching trap
                if (navigator.serviceWorker) {
                  navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (var i = 0; i < registrations.length; i++) {
                      registrations[i].unregister();
                    }
                  });
                }
                // Clear browser Cache Storage to bypass stale html caching
                if (window.caches) {
                  window.caches.keys().then(function(keys) {
                    for (var i = 0; i < keys.length; i++) {
                      window.caches.delete(keys[i]);
                    }
                  });
                }
              } catch (cacheErr) {}

              var lastReload = sessionStorage.getItem("last_chunk_reload");
              var now = Date.now();
              if (!lastReload || now - parseInt(lastReload, 10) > 15000) {
                sessionStorage.setItem("last_chunk_reload", now.toString());
                var url = new URL(window.location.href);
                url.searchParams.set("t", now.toString());
                console.warn("Script load/chunk failure detected in HTML head. Reloading...", url.toString());
                window.location.replace(url.toString());
              }
            }
          } catch (err) {
            window.location.reload();
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          var reason = (e.reason && e.reason.message) || "";
          if (reason.indexOf("Failed to fetch dynamically imported module") >= 0 || reason.indexOf("Importing a module script failed") >= 0) {
            try {
              var lastReload = sessionStorage.getItem("last_chunk_reload");
              var now = Date.now();
              if (!lastReload || now - parseInt(lastReload, 10) > 15000) {
                sessionStorage.setItem("last_chunk_reload", now.toString());
                var url = new URL(window.location.href);
                url.searchParams.set("t", now.toString());
                window.location.replace(url.toString());
              }
            } catch (err) {
              window.location.reload();
            }
          }
        });
      })();
    </script>

    <!-- Vercel edge caching: HTML is a shell, assets are hashed — safe to cache -->
    <script>
      (function() {
        var cachedFavicon = localStorage.getItem("cached_favicon_url");
        if (cachedFavicon && (cachedFavicon.includes("lovable") || cachedFavicon.includes("gptengineer") || cachedFavicon.includes("lovable-uploader"))) {
          localStorage.removeItem("cached_favicon_url");
          cachedFavicon = null;
        }
        if (cachedFavicon && cachedFavicon.trim() !== "") {
          var cacheBustedUrl = cachedFavicon + (cachedFavicon.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
          var link = document.createElement("link");
          link.id = "dynamic-favicon";
          link.rel = "icon";
          link.href = cacheBustedUrl;
          
          var appleLink = document.createElement("link");
          appleLink.id = "dynamic-apple-icon";
          appleLink.rel = "apple-touch-icon";
          appleLink.href = cacheBustedUrl;
          
          document.head.appendChild(link);
          document.head.appendChild(appleLink);
        } else {
          var link = document.createElement("link");
          link.id = "dynamic-favicon";
          link.rel = "icon";
          link.href = "/favicon.ico?v=" + Date.now();
          
          var appleLink = document.createElement("link");
          appleLink.id = "dynamic-apple-icon";
          appleLink.rel = "apple-touch-icon";
          appleLink.href = "/favicon.ico?v=" + Date.now();
          
          document.head.appendChild(link);
          document.head.appendChild(appleLink);
        }
      })();
    </script>
